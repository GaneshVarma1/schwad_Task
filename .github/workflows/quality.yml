name: quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: ruff check app tests scripts server.py
      - run: ruff format --check app tests scripts server.py
      - run: bandit -r app server.py -q
      - run: pytest --cov-fail-under=95
      - run: python scripts/export_openapi.py --check
      - run: python scripts/verify_http.py
      - run: pip-audit -r requirements.lock
